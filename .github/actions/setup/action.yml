name: Setup
description: Node (from .nvmrc) + cached npm ci for the whole workspace, optionally the pinned Vercel CLI.

inputs:
  vercel-cli:
    description: Install the pinned Vercel CLI
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
      env:
        # Git hooks are a local-dev concern (https://typicode.github.io/husky/how-to.html#ci-server-and-docker).
        HUSKY: '0'

    # Pinned on purpose: `vercel@latest` makes deploys non-reproducible.
    # Bump deliberately (Dependabot does not track global CLIs).
    - name: Install Vercel CLI
      if: inputs.vercel-cli == 'true'
      shell: bash
      run: npm install --global vercel@61.0.0 --no-audit --no-fund
