name: Setup
description: pnpm (version pinned in package.json) + Node (from .nvmrc) + cached frozen install for the whole workspace, optionally the pinned Vercel CLI.

inputs:
  vercel-cli:
    description: Install the pinned Vercel CLI
    default: 'false'

runs:
  using: composite
  steps:
    # No `version` input: read from package.json ("devEngines.packageManager", same as "packageManager").
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        # Git hooks are a local-development concern (https://typicode.github.io/husky/how-to.html#ci-server-and-docker).
        HUSKY: '0'

    # Pinned on purpose: `vercel@latest` makes deploys non-reproducible.
    # Bump deliberately (Dependabot does not track global CLIs).
    - name: Install Vercel CLI
      if: inputs.vercel-cli == 'true'
      shell: bash
      run: pnpm add --global vercel@61.0.0
