name: Setup
description: pnpm (version pinned in package.json) + Node (from .nvmrc) + cached frozen install for the whole workspace, optionally the pinned Vercel CLI.

inputs:
  vercel-cli:
    description: Install the pinned Vercel CLI
    default: 'false'

runs:
  using: composite
  steps:
    # No `version` input: read from package.json ("devEngines.packageManager", same as "packageManager").
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        # Git hooks are a local-dev concern (https://typicode.github.io/husky/how-to.html#ci-server-and-docker).
        HUSKY: '0'

    # Pinned on purpose: `vercel@latest` makes deploys non-reproducible.
    # Bump deliberately (Dependabot does not track global CLIs).
    - name: Install Vercel CLI
      if: inputs.vercel-cli == 'true'
      shell: bash
      run: pnpm add --global vercel@61.0.0
