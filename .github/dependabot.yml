version: 2
updates:
  # Covers the root app and the `studio` workspace (single root lockfile).
  - package-ecosystem: npm # also covers pnpm (detects pnpm-lock.yaml)
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Same major as @nuxtjs/sanity uses (ADR 0003): bumped together with it, by hand.
      - dependency-name: '@portabletext/vue'
        update-types: [version-update:semver-major]
      - dependency-name: '@sanity/client'
        update-types: [version-update:semver-major]

  # Keeps the SHA-pinned actions in .github/ up to date.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
