version: 2
updates:
  # Covers the root app and the `studio` workspace (single root lockfile).
  - package-ecosystem: npm # also covers pnpm (detects pnpm-lock.yaml)
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/ up to date.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
