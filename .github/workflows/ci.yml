# ─────────────────────────────────────────────────────────────────────────────
# CI — the single quality gate.
# Runs on every PR (into develop, main, or a branch a PR is stacked on), and is
# called by deploy.yml before any deployment (nothing reaches an environment
# without passing this file).
# Docs: docs/deployment/DEPLOYMENT.md
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PRs: a new push cancels the previous run of the same PR (by number: two PRs from branches with
  # the same name never cancel each other). Called from deploy: never shared.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  # Git flow guard: only `develop` (releases) and `hotfix/*` may target main.
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]]; then exit 0; fi
          echo "::error::PRs into main must come from 'develop' or 'hotfix/*' (got '$HEAD_REF')."
          exit 1

  verify:
    name: Lint · Format · Types · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

      # Generated CMS types must match the schema + queries in this commit.
      - name: Sanity types are up to date
        run: |
          pnpm typegen
          git diff --exit-code -- types/sanity.types.ts \
            || { echo "::error::types/sanity.types.ts is stale. Run 'pnpm typegen' and commit."; exit 1; }

      - run: pnpm typecheck
      - run: pnpm test:coverage

  build-e2e:
    name: Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          vercel-cli: 'true'

      # Vercel is the single source of truth for app env vars.
      # CI always tests against the Feature values (Vercel Preview, all branches).
      - name: Pull Feature env from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WEBAPP_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PROJECT_ID }}
          STUDIO_PROJECT_ID: ${{ vars.VERCEL_STUDIO_PROJECT_ID }}
        run: |
          VERCEL_PROJECT_ID="$WEBAPP_PROJECT_ID" vercel env pull .env --environment=preview --yes --token="$VERCEL_TOKEN"
          VERCEL_PROJECT_ID="$STUDIO_PROJECT_ID" vercel env pull studio/.env --environment=preview --yes --token="$VERCEL_TOKEN"

      - name: Build Studio
        run: |
          set -a; source studio/.env; set +a
          pnpm studio:build

      # Against the fixture CMS (build-time sitemap included): E2E never depends on a live dataset.
      - name: Build Web App
        run: pnpm build:e2e
        env:
          # The pulled .env contains VERCEL=1; force a runnable Node server for E2E.
          NITRO_PRESET: node-server

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Pull requests only, once the code is proven (lint, types, unit, E2E): the branch is deployed to
  # Vercel with the Feature environment's variables (Vercel Preview, all branches) on its own address,
  # `<project>-pr-<number>.vercel.app`, so every PR can be seen live and audited on the real platform
  # (CDN, compression, image optimisation) without another PR replacing it. Closing the PR removes it
  # (feature-cleanup.yml).
  deploy-feature:
    name: Deploy feature
    needs: [verify, build-e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No shared queue: a new push to the same PR cancels this run (workflow concurrency above), and
    # another PR's deployment waits in Vercel's own build queue (the wait below allows for it).
    permissions:
      contents: read
      deployments: write
    # GitHub shows "View deployment" on the PR. One environment for every PR: a newer deployment of
    # another PR marks this one inactive there, so the PR report and the run summary carry the address.
    environment:
      name: feature
      url: ${{ steps.alias.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      feature-url: ${{ steps.alias.outputs.url }}
    env:
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          vercel-cli: 'true'

      # The Feature environment's variables, the source of truth in Vercel: Preview rows that apply
      # to every branch (development dataset, NUXT_SITE_ENV=feature). The rows scoped to `develop`
      # belong to the Development environment and are not pulled here.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Give this pull request its own address
        run: |
          project=$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r .name)
          host="$project-pr-$PR.vercel.app"
          label="${host%.vercel.app}"
          [ ${#label} -le 63 ] || { echo "::error::$label is longer than 63 characters, the limit of a host name. Shorten the Vercel project name."; exit 1; }
          # The Feature value of NUXT_PUBLIC_SITE_URL is a default: canonical links, hreflang and
          # the sitemap of this deployment use the PR's own address.
          sed -i '/^NUXT_PUBLIC_SITE_URL=/d' .vercel/.env.preview.local
          echo "NUXT_PUBLIC_SITE_URL=\"https://$host\"" >> .vercel/.env.preview.local
          echo "FEATURE_HOST=$host" >> "$GITHUB_ENV"

      - run: vercel build --token="$VERCEL_TOKEN"
        env:
          NITRO_PRESET: vercel

      # `pr=<number>` lets feature-cleanup.yml find every deployment of this PR.
      - name: Deploy the branch
        id: deploy
        timeout-minutes: 5
        run: |
          runtime=()
          while IFS= read -r line; do runtime+=(-e "${line//\"/}"); done < <(grep -E '^NUXT_' .vercel/.env.preview.local)
          url=$(vercel deploy --prebuilt --no-wait --meta pr="$PR" "${runtime[@]}" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployment
        timeout-minutes: 12
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: vercel inspect "$DEPLOY_URL" --wait --timeout 10m --token="$VERCEL_TOKEN"

      # A failed or cancelled wait leaves the deployment building on Vercel: never leave one behind.
      - name: Discard an unfinished deployment
        if: (failure() || cancelled()) && steps.deploy.outputs.url != ''
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: vercel remove "$DEPLOY_URL" --yes --token="$VERCEL_TOKEN" || true

      - name: Point the PR's address
        id: alias
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel alias set "$DEPLOY_URL" "$FEATURE_HOST" --token="$VERCEL_TOKEN"
          echo "url=https://$FEATURE_HOST" >> "$GITHUB_OUTPUT"
          echo "### This PR is live" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://$FEATURE_HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

  # Web performance gate on the feature deployment, measured by Google PageSpeed Insights (Google's
  # servers, as pagespeed.web.dev): each page template once, in the default language, mobile and
  # desktop, against webPerformance.config.ts (aim 90+, fails under 80). It audits this commit's
  # deployment URL, so a later push to the PR cannot change the result.
  web-performance:
    name: Web performance
    needs: deploy-feature
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: PageSpeed Insights on the feature deployment
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          [ -n "$PAGESPEED_API_KEY" ] || { echo "::error::Secret PAGESPEED_API_KEY is missing (docs/deployment/DEPLOYMENT.md, Web performance)."; exit 1; }
          pnpm web-performance --url="${{ needs.deploy-feature.outputs.url }}"

      - name: Web performance summary
        if: always()
        run: |
          node tests/webPerformance/summary.ts > web-performance-summary.md
          cat web-performance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-performance
          path: |
            .web-performance
            web-performance-summary.md
          include-hidden-files: true
          retention-days: 14

  # One comment per pull request, rewritten on every push (never a new one): branch, commit, the
  # PR's feature address, every step's result and the web performance table. Nobody needs Vercel access.
  report:
    name: PR report
    needs: [verify, build-e2e, deploy-feature, web-performance]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: web-performance

      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEATURE_URL: ${{ needs.deploy-feature.outputs.feature-url }}
          DEPLOYMENT_URL: ${{ needs.deploy-feature.outputs.url }}
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.build-e2e.result }}
          DEPLOY: ${{ needs.deploy-feature.result }}
          WEB_PERFORMANCE: ${{ needs.web-performance.result }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; skipped) echo "⏭️";; *) echo "⏳";; esac; }
          marker='<!-- pr-report -->'
          {
            echo "$marker"
            echo "## 🚀 Pull request report"
            echo
            echo "**Branch** \`$BRANCH\` · **Commit** \`${SHA:0:7}\` · [Run details]($RUN_URL)"
            echo
            if [ "$DEPLOY" = success ]; then
              echo "### 🔗 Live on feature: **$FEATURE_URL**"
              echo
              echo "Deployment of this commit: $DEPLOYMENT_URL (the address above always shows this PR's latest push)."
            else
              echo "### 🔗 Not deployed to feature (the checks before it did not pass)"
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | :---: |"
            echo "| Lint · Format · Types · Unit | $(icon "$VERIFY") |"
            echo "| Build · E2E | $(icon "$E2E") |"
            echo "| Deploy feature | $(icon "$DEPLOY") |"
            echo "| Web performance (PageSpeed Insights) | $(icon "$WEB_PERFORMANCE") |"
            echo
            echo "### 📊 Web performance on feature (Google PageSpeed Insights)"
            echo
            if [ -f web-performance-summary.md ]; then cat web-performance-summary.md; else echo "_Not run._"; fi
            echo
            echo "Full reports: the \`web-performance\` artifact of the [run]($RUN_URL), or any page on [pagespeed.web.dev](https://pagespeed.web.dev/analysis?url=$DEPLOYMENT_URL)."
          } > report.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api "repos/$REPO/issues/comments/$id" --method PATCH -F body=@report.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" --method POST -F body=@report.md > /dev/null
          fi
