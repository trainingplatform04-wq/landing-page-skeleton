# ─────────────────────────────────────────────────────────────────────────────
# CI — the single quality gate.
# Runs on every PR to develop/main, and is called by deploy.yml before any
# deployment (nothing reaches an environment without passing this file).
# Docs: docs/deployment/DEPLOYMENT.md
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # PRs: a new push cancels the previous run. Called from deploy: never shared.
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  # Git flow guard: only `develop` (releases) and `hotfix/*` may target main.
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == hotfix/* ]]; then exit 0; fi
          echo "::error::PRs into main must come from 'develop' or 'hotfix/*' (got '$HEAD_REF')."
          exit 1

  verify:
    name: Lint · Format · Types · Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

      # Generated CMS types must match the schema + queries in this commit.
      - name: Sanity types are up to date
        run: |
          pnpm typegen
          git diff --exit-code -- types/sanity.types.ts \
            || { echo "::error::types/sanity.types.ts is stale. Run 'pnpm typegen' and commit."; exit 1; }

      - run: pnpm typecheck
      - run: pnpm test:coverage

  build-e2e:
    name: Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          vercel-cli: 'true'

      # Vercel is the single source of truth for app env vars.
      # CI always tests against the Preview (= staging) values.
      - name: Pull staging env from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WEBAPP_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PROJECT_ID }}
          STUDIO_PROJECT_ID: ${{ vars.VERCEL_STUDIO_PROJECT_ID }}
        run: |
          VERCEL_PROJECT_ID="$WEBAPP_PROJECT_ID" vercel env pull .env --environment=preview --yes --token="$VERCEL_TOKEN"
          VERCEL_PROJECT_ID="$STUDIO_PROJECT_ID" vercel env pull studio/.env --environment=preview --yes --token="$VERCEL_TOKEN"

      - name: Build Studio
        run: |
          set -a; source studio/.env; set +a
          pnpm studio:build

      # Against the fixture CMS (build-time sitemap included): E2E never depends on staging.
      - name: Build Web App
        run: pnpm build:e2e
        env:
          # The pulled .env contains VERCEL=1; force a runnable Node server for E2E.
          NITRO_PRESET: node-server

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Web performance gate: only once the code is proven (lint, types, unit, E2E). Every page in
  # every language, mobile and desktop in parallel, judged against lighthouse.config.ts.
  lighthouse:
    name: Lighthouse · ${{ matrix.form-factor }}
    needs: [verify, build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report both form factors even when one fails.
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          vercel-cli: 'true'

      # The staging content (real texts and pictures): what visitors get.
      - name: Pull staging env from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WEBAPP_PROJECT_ID: ${{ vars.VERCEL_WEBAPP_PROJECT_ID }}
        run: VERCEL_PROJECT_ID="$WEBAPP_PROJECT_ID" vercel env pull .env --environment=preview --yes --token="$VERCEL_TOKEN"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Lighthouse runs in Playwright's Chromium: the same browser as locally.
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Builds with the production robots settings (inside this job only, never deployed).
      - run: pnpm lighthouse ${{ matrix.form-factor }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ matrix.form-factor }}
          path: .lighthouseci/${{ matrix.form-factor }}
          retention-days: 14
